name: Agentic RAG CI/CD Pipeline

# 1. Trigger: Kab chalana hai?
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# 2. Jobs: Kya kaam karna hai?
jobs:
  build-and-test:
    runs-on: ubuntu-latest  # GitHub ka server

    steps:
    # A. Code Checkout (Repo download karo)
    - name: Checkout Code
      uses: actions/checkout@v3

    # B. Set up Python
    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"

    # C. Install Dependencies
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest httpx pytest-asyncio # Test libs bhi install karo

    # D. Linting (Optional but good: Check code style)
    # - name: Lint with flake8
    #   run: |
    #     pip install flake8
    #     flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

    # E. Run Tests
    - name: Run Unit Tests
      # Env vars set karne padenge fake values ke sath taaki code crash na ho
      env:
        groq_api_key: "dummy_key"
        TAVILY_API_KEY: "dummy_key"
        hf_api_key: "dummy_key"
        QDRANT_URL: "http://localhost:6333" # Dummy url
      run: |
        pytest test_app.py