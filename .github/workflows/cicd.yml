name: Agentic RAG CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    # 🔥 NEW: Yahan hum Qdrant ka container chala rahe hain testing ke liye
    services:
      qdrant:
        image: qdrant/qdrant:latest
        ports:
          - 6333:6333
        # Simple health check to ensure DB is ready
        options: >-
          --health-cmd "apt-get update && apt-get install -y curl && curl -f http://localhost:6333/readyz || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest httpx pytest-asyncio
    - name: Create Dummy Qdrant Collection
      run: |
        # Thoda wait karein taaki DB ready ho jaye
        sleep 5 
        curl -X PUT "http://localhost:6333/collections/agentic_rag_db" \
          -H "Content-Type: application/json" \
          -d '{ "vectors": { "size": 768, "distance": "Cosine" } }'

    - name: Run Unit Tests
      # Env vars ab real service se connect honge (Localhost service container par map hoga)
      env:
        CI: "true"
        groq_api_key: "dummy_key"
        TAVILY_API_KEY: "dummy_key"
        hf_api_key: "dummy_key"
        # GitHub Actions mein 'localhost' service container ko point karega
        QDRANT_URL: "http://localhost:6333" 
        QDRANT_API_KEY: "dummy_key" # Agar chahiye ho
      run: |
        pytest test_app.py